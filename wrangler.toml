name = "gush"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
# Keep variables set in the Cloudflare dashboard when deploying.
keep_vars = true

# The site's domain (bought through Cloudflare). www.gush.supply is sent to gush.supply by a redirect
# rule in the Cloudflare dashboard. The old gush.brentfsienko.workers.dev address keeps working too.
workers_dev = true
routes = [
  { pattern = "gush.supply", custom_domain = true },
  { pattern = "www.gush.supply", custom_domain = true },
]

# The built site (dist/) is served as static files. Only /api/* runs the worker code.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Stock tracking: a Cloudflare KV namespace keeping a "sold" count per size (see worker/stock.ts).
[[kv_namespaces]]
binding = "STOCK"
id = "71b455dd29d74023a93e0fb291de2cd2"
